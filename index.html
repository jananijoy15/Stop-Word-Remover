<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stop Word Remover</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Stop Word Remover</h1>
        <p class="subtitle">
            Remove common words from your text
        </p>

        <textarea id="textInput"
            placeholder="Enter or paste your text here..."></textarea>

        <button onclick="removeStopWords()">
            Remove Stop Words
        </button>

        <div class="stats">

            <div>
                <h3 id="before">0</h3>
                <p>Original Words</p>
            </div>

            <div>
                <h3 id="after">0</h3>
                <p>Remaining Words</p>
            </div>

            <div>
                <h3 id="removed">0</h3>
                <p>Removed Words</p>
            </div>

        </div>

        <div class="result">
            <h2>Processed Text</h2>
            <p id="output">
                Your processed text will appear here...
            </p>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
